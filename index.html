<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的工具箱 | Personal Toolkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --border: #e2e8f0;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
      --shadow-hover: 0 16px 30px -4px rgba(79, 70, 229, 0.12);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem;
      flex: 1;
      width: 100%;
    }
    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #eef2ff;
      color: var(--primary);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p.subtitle {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 560px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      color: #334155;
    }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card.clickable:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: #c7d2fe;
    }
    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background: #eef2ff;
      margin-bottom: 1.25rem;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .card-title { font-size: 1.2rem; font-weight: 700; }
    .tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      background: #f1f5f9;
      color: var(--muted);
      border-radius: 6px;
      font-weight: 500;
    }
    .card-desc {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      flex: 1;
    }
    .card-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.9rem;
      padding-top: 1rem;
      border-top: 1px solid #f1f5f9;
    }
    .card.disabled { opacity: 0.6; cursor: not-allowed; }
    .card.disabled .card-icon { background: #f1f5f9; }
    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
      border-top: 1px solid var(--border);
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <header>
      <div class="badge">Vue 3 輕量小工具集</div>
      <h1>{{ title }}</h1>
      <p class="subtitle">{{ desc }}</p>
    </header>

    <main>
      <div class="section-title">工具清單</div>
      <div class="tools-grid">
        <!-- 拾光足跡 小工具卡片 -->
        <a :href="daysTool.url" class="card clickable">
          <div class="card-icon">🗓️</div>
          <div class="card-head">
            <h2 class="card-title">{{ daysTool.name }}</h2>
            <span class="tag">時間管理</span>
          </div>
          <p class="card-desc">{{ daysTool.description }}</p>
          <div class="card-action">
            <span>開啟小工具</span>
            <span>→</span>
          </div>
        </a>

        <!-- 預告卡片 -->
        <div v-for="t in upcomingTools" :key="t.name" class="card disabled">
          <div class="card-icon">{{ t.icon }}</div>
          <div class="card-head">
            <h2 class="card-title">{{ t.name }}</h2>
            <span class="tag">{{ t.tag }}</span>
          </div>
          <p class="card-desc">{{ t.description }}</p>
          <div class="card-action" style="color: #94a3b8;">
            <span>即將推出</span>
            <span>🔒</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <p>© 我的工具箱 · 輕巧、簡約、優雅</p>
  </footer>

  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const title = ref('我的工具箱');
        const desc = ref('記錄生活軌跡、提升時間感知的實用微工具集合。乾淨簡約，點擊即可即時使用。');
        const daysTool = ref({
          name: '拾光足跡',
          url: 'days.html',
          description: '記錄重要紀念日、考試或特定目標。自動計算已過去天數或即將到來的倒數，並支援每年循環紀念。'
        });
        const upcomingTools = ref([
          { name: '極簡蕃茄鐘', icon: '⏱️', tag: '專注', description: '25 分鐘工作、5 分鐘休息的高效時間節奏管理。' },
          { name: '隨心便簽', icon: '📝', tag: '記錄', description: '隨手捕捉靈感與待辦清單，資料即時保存。' }
        ]);

        return { title, desc, daysTool, upcomingTools };
      }
    }).mount('#app');
  </script>
</body>
</html>
