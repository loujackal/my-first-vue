<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光 Time Gleaner — 拾起歲月光彩，記錄生命中每一個值得珍藏的片刻</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #fdfbf7 0%, #f5efe6 100%);
      --card-bg: #ffffff;
      --text-main: #2c2825;
      --text-muted: #786f66;
      --primary: #a3704c;
      --primary-hover: #885936;
      --primary-light: #f7f1ea;
      --border: #e8e1d7;
      --border-hover: #d2c4b2;
      --shadow: 0 4px 20px -2px rgba(44, 40, 37, 0.05);
      --shadow-hover: 0 16px 32px -4px rgba(163, 112, 76, 0.15);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', system-ui, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 3rem;
      flex: 1;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 4rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 18px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 1.25rem;
      box-shadow: 0 2px 8px rgba(163, 112, 76, 0.06);
    }

    h1 {
      font-family: 'Noto Serif TC', 'Cinzel', serif;
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #231f1d;
      margin-bottom: 1rem;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    p.subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 620px;
      margin: 0 auto;
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.01em;
    }

    .section-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #3a3531;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--primary);
      border-radius: 2px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.75rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .card.clickable:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-hover);
    }

    .card.clickable::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: var(--radius);
      box-shadow: inset 0 0 0 1px var(--primary);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .card.clickable:hover::after {
      opacity: 0.35;
    }

    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      background: var(--primary-light);
      margin-bottom: 1.25rem;
      color: var(--primary);
      transition: transform 0.3s ease;
    }

    .card.clickable:hover .card-icon {
      transform: scale(1.08);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }
    .card-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #231f1d;
    }

    .tag {
      font-size: 0.75rem;
      padding: 3px 10px;
      background: #f4efe8;
      color: var(--text-muted);
      border-radius: 999px;
      font-weight: 500;
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      flex: 1;
      line-height: 1.65;
    }

    .card-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.92rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      transition: color 0.2s;
    }

    .card.clickable:hover .card-action {
      color: var(--primary-hover);
    }

    .card.disabled {
      opacity: 0.65;
      cursor: not-allowed;
      background: rgba(255, 255, 255, 0.7);
    }

    .card.disabled .card-icon {
      background: #f0ebe4;
    }

    footer {
      text-align: center;
      padding: 2.5rem 1.5rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
    }

    @media (max-width: 640px) {
      .container { padding-top: 3rem; }
      h1 { font-size: 2.1rem; }
      p.subtitle { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <header>
      <div class="badge">✦ 拾光 Time Gleaner ✦</div>
      <h1>{{ title }}</h1>
      <p class="subtitle">{{ desc }}</p>
    </header>

    <main>
      <div class="section-title">拾光足跡與工具</div>
      <div class="tools-grid">
        <!-- 拾光足跡 小工具卡片 -->
        <a :href="daysTool.url" class="card clickable">
          <div class="card-icon">⏳</div>
          <div class="card-head">
            <h2 class="card-title">{{ daysTool.name }}</h2>
            <span class="tag">歲月記錄</span>
          </div>
          <p class="card-desc">{{ daysTool.description }}</p>
          <div class="card-action">
            <span>開啟拾光足跡</span>
            <span>→</span>
          </div>
        </a>

        <!-- 預告卡片 -->
        <div v-for="t in upcomingTools" :key="t.name" class="card disabled">
          <div class="card-icon">{{ t.icon }}</div>
          <div class="card-head">
            <h2 class="card-title">{{ t.name }}</h2>
            <span class="tag">{{ t.tag }}</span>
          </div>
          <p class="card-desc">{{ t.description }}</p>
          <div class="card-action" style="color: #a0978d;">
            <span>即將推出</span>
            <span>🔒</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <p>© 拾光 Time Gleaner · 拾起歲月光彩，記錄生命中每一個值得珍藏的片刻</p>
  </footer>

  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const title = ref('拾光 Time Gleaner');
        const desc = ref('拾起歲月光彩，記錄生命中每一個值得珍藏的片刻。');
        const daysTool = ref({
          name: '拾光足跡',
          url: 'days.html',
          description: '記錄重要紀念日、考試倒數與特別目標。自動計算已過去天數或即將到來的倒數，並支援每年循環紀念。'
        });
        const upcomingTools = ref([
          { name: '極簡蕃茄鐘', icon: '⏱️', tag: '專注儀式', description: '25 分鐘的專注時光與沉澱，感受時光流淌的純粹節奏。' },
          { name: '隨心便簽', icon: '📝', tag: '靈感拾遺', description: '隨手捕捉閃爍的靈感與思緒，溫柔記錄當下的點滴。' }
        ]);

        return { title, desc, daysTool, upcomingTools };
      }
    }).mount('#app');
  </script>
</body>
</html>
